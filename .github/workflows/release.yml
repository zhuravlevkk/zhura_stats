# Secrets (repository) for CurseForge upload on tag builds:
#   CURSEFORGE_TOKEN — API token from https://authors-old.curseforge.com/account/api-tokens
#   CURSEFORGE_PROJECT_ID — numeric project ID from the CurseForge project URL

name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read addon version from TOC
        id: version
        shell: pwsh
        run: |
          $tocPath = Join-Path $env:GITHUB_WORKSPACE 'ZhuraStats.toc'
          $versionLine = Select-String -Path $tocPath -Pattern '^## Version:\s*(.+)$' | Select-Object -First 1
          if (-not $versionLine) {
            throw "Could not find ## Version in ZhuraStats.toc"
          }

          $tocVersion = $versionLine.Matches[0].Groups[1].Value.Trim()
          $tagName = "${{ github.ref_name }}"
          $isTagRef = "${{ startsWith(github.ref, 'refs/tags/v') }}"
          $releaseVersion = if ($isTagRef -eq 'true' -and $tagName) { $tagName.TrimStart('v') } else { $tocVersion }
          if ($isTagRef -eq 'true' -and $tagName) {
            $tagName = if ($tagName.StartsWith('v')) { $tagName } else { "v$tagName" }
          } else {
            $tagName = "v$tocVersion"
          }

          "toc_version=$tocVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build release archive
        id: archive
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $stageRoot = Join-Path $env:RUNNER_TEMP 'release-stage'
          $addonDir = Join-Path $stageRoot 'ZhuraStats'
          $zipName = "NE-Stats-v${{ steps.version.outputs.release_version }}.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          $tocPath = Join-Path $workspace 'ZhuraStats.toc'
          $embedsPath = Join-Path $workspace 'embeds.xml'

          if (Test-Path $stageRoot) {
            Remove-Item -LiteralPath $stageRoot -Recurse -Force
          }
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          New-Item -ItemType Directory -Path $addonDir -Force | Out-Null

          if (-not (Test-Path -LiteralPath $tocPath)) {
            throw "Required file ZhuraStats.toc is missing."
          }

          $tocEntries = Get-Content -LiteralPath $tocPath |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') -and -not $_.StartsWith('##') }

          if (-not $tocEntries) {
            throw "ZhuraStats.toc does not contain file entries."
          }

          $requiredPaths = @('ZhuraStats.toc')
          foreach ($entry in $tocEntries) {
            $normalized = $entry -replace '/', '\'
            $requiredPaths += $normalized
          }

          $missingRequired = @()
          foreach ($relativePath in $requiredPaths) {
            $sourcePath = Join-Path $workspace $relativePath
            if (-not (Test-Path -LiteralPath $sourcePath)) {
              $missingRequired += $relativePath
            }
          }

          if ($missingRequired.Count -gt 0) {
            $missingList = $missingRequired -join ', '
            throw "Release package is missing required files from TOC: $missingList"
          }

          if (Test-Path -LiteralPath $embedsPath) {
            $libReferences = Select-String -Path $embedsPath -Pattern 'Libs[\\/][^"]+' -AllMatches |
              ForEach-Object { $_.Matches } |
              ForEach-Object { $_.Value }

            foreach ($libReference in $libReferences) {
              $normalizedLibPath = $libReference -replace '/', '\'
              $libSourcePath = Join-Path $workspace $normalizedLibPath
              if (-not (Test-Path -LiteralPath $libSourcePath)) {
                throw "embeds.xml references missing library asset: $normalizedLibPath"
              }
            }
          }

          foreach ($relativePath in $requiredPaths) {
            $sourcePath = Join-Path $workspace $relativePath
            $destinationPath = Join-Path $addonDir $relativePath
            $destinationDir = Split-Path -Parent $destinationPath

            if ($destinationDir -and -not (Test-Path -LiteralPath $destinationDir)) {
              New-Item -ItemType Directory -Path $destinationDir -Force | Out-Null
            }

            if (Test-Path -LiteralPath $sourcePath -PathType Container) {
              Copy-Item -LiteralPath $sourcePath -Destination $destinationPath -Recurse -Force
            } else {
              Copy-Item -LiteralPath $sourcePath -Destination $destinationPath -Force
            }
          }

          $libsSourcePath = Join-Path $workspace 'Libs'
          if (Test-Path -LiteralPath $libsSourcePath) {
            Copy-Item -LiteralPath $libsSourcePath -Destination (Join-Path $addonDir 'Libs') -Recurse -Force
          }

          if (Test-Path (Join-Path $workspace 'README.md')) {
            Copy-Item -LiteralPath (Join-Path $workspace 'README.md') -Destination $addonDir
          }
          if (Test-Path (Join-Path $workspace 'LICENSE')) {
            Copy-Item -LiteralPath (Join-Path $workspace 'LICENSE') -Destination $addonDir
          }

          Compress-Archive -Path $addonDir -DestinationPath $zipPath -Force

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.archive.outputs.zip_name }}
          path: ${{ steps.archive.outputs.zip_path }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: NE Stats v${{ steps.version.outputs.release_version }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: ${{ steps.archive.outputs.zip_path }}
          generate_release_notes: true

      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          ZIP_PATH: ${{ steps.archive.outputs.zip_path }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CF_TOKEN) -or [string]::IsNullOrWhiteSpace($env:CF_PROJECT_ID)) {
            throw "CurseForge upload requires secrets CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID."
          }

          $zipPath = $env:ZIP_PATH
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Release zip not found: $zipPath"
          }

          $headers = @{ "X-Api-Token" = $env:CF_TOKEN }
          $versions = Invoke-RestMethod -Uri "https://wow.curseforge.com/api/game/versions" -Headers $headers -Method Get
          if (-not $versions) {
            throw "CurseForge game versions API returned no data."
          }

          # Retail rows use gameVersionTypeID 517 per CurseForge WoW documentation.
          $retailTypeId = 517
          $candidates = @($versions | Where-Object {
            $typeId = $_.gameVersionTypeID
            if ($null -eq $typeId) { $typeId = $_.gameVersionTypeId }
            $typeId -eq $retailTypeId -and $_.name -match '^\d+\.\d+\.\d+$'
          })
          if ($candidates.Count -eq 0) {
            throw "No Retail (gameVersionTypeID $retailTypeId) semver game versions in CurseForge response."
          }

          $latest = $candidates | Sort-Object { [version]$_.name } -Descending | Select-Object -First 1
          $gameVersionId = $latest.id
          Write-Host "Selected CurseForge game version id=$gameVersionId (name=$($latest.name))."

          $ver = $env:RELEASE_VERSION
          $tag = $env:TAG_NAME
          $repo = $env:GITHUB_REPO
          $changelog = "## NE Stats v$ver`n`nSee [GitHub release $tag](https://github.com/$repo/releases/tag/$tag) for notes."

          $metadataJson = [ordered]@{
            changelog     = $changelog
            changelogType = "markdown"
            displayName   = "NE Stats v$ver"
            releaseType   = "release"
            gameVersions  = @($gameVersionId)
          } | ConvertTo-Json -Compress

          $projectId = $env:CF_PROJECT_ID.Trim()
          $uploadUri = "https://wow.curseforge.com/api/projects/$projectId/upload-file"

          $response = Invoke-RestMethod -Uri $uploadUri -Method Post -Headers $headers -Form @{
            metadata = $metadataJson
            file     = Get-Item -LiteralPath $zipPath
          }

          Write-Host "CurseForge upload succeeded, file id=$($response.id)."
