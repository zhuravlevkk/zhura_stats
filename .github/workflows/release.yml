# Secrets (repository) for CurseForge upload on tag builds:
#   CURSEFORGE_TOKEN -- API token from https://authors-old.curseforge.com/account/api-tokens
#   CURSEFORGE_PROJECT_ID -- numeric project ID from the CurseForge project URL

name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read addon version from TOC
        id: version
        shell: bash
        run: |
          set -euo pipefail

          toc_version="$(sed -n 's/^## Version:[[:space:]]*//p' ZhuraStats.toc | head -n1 | tr -d '\r')"
          if [ -z "$toc_version" ]; then
            echo "Could not find ## Version in ZhuraStats.toc" >&2
            exit 1
          fi

          tag_name="${{ github.ref_name }}"
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" && -n "$tag_name" ]]; then
            release_version="${tag_name#v}"
            [[ "$tag_name" == v* ]] || tag_name="v$tag_name"
          else
            release_version="$toc_version"
            tag_name="v$toc_version"
          fi

          echo "toc_version=$toc_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          workspace="$GITHUB_WORKSPACE"
          stage_root="$RUNNER_TEMP/release-stage"
          addon_dir="$stage_root/ZhuraStats"
          zip_name="NE-Stats-v${{ steps.version.outputs.release_version }}.zip"
          zip_path="$RUNNER_TEMP/$zip_name"
          toc_path="$workspace/ZhuraStats.toc"
          embeds_path="$workspace/embeds.xml"

          rm -rf "$stage_root"
          rm -f "$zip_path"
          mkdir -p "$addon_dir"

          if [ ! -f "$toc_path" ]; then
            echo "Required file ZhuraStats.toc is missing." >&2
            exit 1
          fi

          mapfile -t toc_entries < <(
            sed 's/\r$//' "$toc_path" |
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' |
            grep -vE '^($|#)'
          )
          if [ "${#toc_entries[@]}" -eq 0 ]; then
            echo "ZhuraStats.toc does not contain file entries." >&2
            exit 1
          fi

          required_paths=("ZhuraStats.toc")
          for entry in "${toc_entries[@]}"; do
            normalized="${entry//\\//}"
            required_paths+=("$normalized")
          done

          missing=()
          for relative in "${required_paths[@]}"; do
            if [ ! -e "$workspace/$relative" ]; then
              missing+=("$relative")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Release package is missing required files from TOC: ${missing[*]}" >&2
            exit 1
          fi

          if [ -f "$embeds_path" ]; then
            mapfile -t lib_refs < <(grep -oE 'Libs[\\/][^"]+' "$embeds_path" | sed 's#\\#/#g')
            for lib_ref in "${lib_refs[@]}"; do
              if [ ! -e "$workspace/$lib_ref" ]; then
                echo "embeds.xml references missing library asset: $lib_ref" >&2
                exit 1
              fi
            done
          fi

          for relative in "${required_paths[@]}"; do
            mkdir -p "$addon_dir/$(dirname "$relative")"
            cp -R "$workspace/$relative" "$addon_dir/$relative"
          done

          if [ -d "$workspace/Libs" ]; then
            cp -R "$workspace/Libs" "$addon_dir/Libs"
          fi
          if [ ! -d "$workspace/Media" ]; then
            echo "Media folder is missing (required for RefArrow textures)." >&2
            exit 1
          fi
          cp -R "$workspace/Media" "$addon_dir/Media"
          if [ -f "$workspace/README.md" ]; then
            cp "$workspace/README.md" "$addon_dir/README.md"
          fi
          if [ -f "$workspace/LICENSE" ]; then
            cp "$workspace/LICENSE" "$addon_dir/LICENSE"
          fi

          (cd "$stage_root" && zip -r "$zip_path" "ZhuraStats")

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.archive.outputs.zip_name }}
          path: ${{ steps.archive.outputs.zip_path }}

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_path="$RUNNER_TEMP/release-notes.md"
          bash .github/scripts/new-release-notes.sh \
            --version '${{ steps.version.outputs.release_version }}' \
            --tag-name '${{ steps.version.outputs.tag_name }}' \
            --output "$notes_path"
          echo "path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          name: NE Stats v${{ steps.version.outputs.release_version }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: ${{ steps.archive.outputs.zip_path }}
          body_path: ${{ steps.notes.outputs.path }}

      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          ZIP_PATH: ${{ steps.archive.outputs.zip_path }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_NOTES_PATH: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail

          if [ -z "${CF_TOKEN:-}" ] || [ -z "${CF_PROJECT_ID:-}" ]; then
            echo "CurseForge upload requires secrets CURSEFORGE_TOKEN and CURSEFORGE_PROJECT_ID." >&2
            exit 1
          fi

          versions=$(curl -s -H "X-Api-Token: $CF_TOKEN" "https://wow.curseforge.com/api/game/versions")

          game_version_id=$(echo "$versions" | jq -r '
            [.[] | select(.gameVersionTypeID == 517 and (.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))]
            | sort_by(.name | split(".") | map(tonumber))
            | last
            | .id
          ')

          if [ -z "$game_version_id" ] || [ "$game_version_id" = "null" ]; then
            echo "Could not determine CurseForge retail game version ID." >&2
            exit 1
          fi
          echo "Selected CurseForge game version id=$game_version_id."

          metadata=$(jq -n \
            --rawfile changelog "$RELEASE_NOTES_PATH" \
            --arg displayName "NE Stats v${RELEASE_VERSION}" \
            --argjson gameVersions "[${game_version_id}]" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $displayName, releaseType: "release", gameVersions: $gameVersions}')

          file_id=""
          response=""
          delay=5
          for attempt in 1 2 3 4 5; do
            echo "Uploading to CurseForge (attempt $attempt/5)."
            if response=$(curl -sS -X POST \
              -H "X-Api-Token: $CF_TOKEN" \
              -F "metadata=$metadata" \
              -F "file=@${ZIP_PATH}" \
              "https://wow.curseforge.com/api/projects/${CF_PROJECT_ID}/upload-file"); then
              file_id=$(echo "$response" | jq -r '.id')
              if [ -n "$file_id" ] && [ "$file_id" != "null" ]; then
                break
              fi
            fi

            if [ "$attempt" -lt 5 ]; then
              echo "CurseForge upload did not return a file id. Response: $response" >&2
              echo "Retrying in ${delay}s."
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done

          if [ -z "$file_id" ] || [ "$file_id" = "null" ]; then
            echo "CurseForge upload failed after 5 attempts. Last response: $response" >&2
            exit 1
          fi
          echo "CurseForge upload succeeded, file id=$file_id."
