name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Lua 5.1 and LuaRocks
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential liblua5.1-0-dev lua5.1 luarocks unzip

      - name: Install busted
        run: |
          set -euo pipefail
          sudo luarocks --lua-version=5.1 install busted

      - name: Run busted
        run: |
          set -euo pipefail
          busted --config-file=.busted
