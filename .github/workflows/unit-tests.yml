name: Unit tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lua:
              - '**.lua'
              - '.busted'
              - '.luacov'
              - '.github/workflows/unit-tests.yml'

      - name: Install Lua 5.1 and LuaRocks
        if: steps.filter.outputs.lua == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential liblua5.1-0-dev lua5.1 luarocks unzip

      - name: Install busted and luacov
        if: steps.filter.outputs.lua == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          sudo luarocks --lua-version=5.1 install busted
          sudo luarocks --lua-version=5.1 install luacov

      - name: Run busted with coverage
        if: steps.filter.outputs.lua == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          busted --config-file=.busted --coverage

      - name: Generate LuaCov report from stats
        if: (steps.filter.outputs.lua == 'true' || github.event_name == 'workflow_dispatch') && always()
        run: |
          set -euo pipefail
          if [ -f luacov.stats.out ]; then
            luacov -c .luacov
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luacov-report
          path: luacov.report.out
          if-no-files-found: ignore

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: busted
    if: failure()
    steps:
      - name: Telegram
        run: |
          MSG=$(printf '%s\n' \
            '❌ *zhura_stats* · Unit Tests failed' \
            "PR: ${{ github.event.pull_request.html_url }}" \
            "Run: ${URL}")
          curl -sf -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=${MSG}"
        env:
          BOT:  ${{ secrets.TG_BOT_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
          URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
