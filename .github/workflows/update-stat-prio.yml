# Regenerates WoWLogsStatsPrio.lua from archon.gg and bumps patch in ZhuraStats.toc when data changes.
# Pushes to master only; tag-release.yml creates the tag from the new TOC version.

name: Update Stat Priority

on:
  schedule:
    - cron: "0 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-stat-prio
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Skip if already fetched today (UTC)
        id: freshness
        shell: pwsh
        run: |
          $luaPath = Join-Path $env:GITHUB_WORKSPACE 'WoWLogsStatsPrio.lua'
          $today   = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          if (Test-Path $luaPath) {
            $head = (Get-Content $luaPath -TotalCount 5) -join "`n"
            if ($head -match $today) {
              Write-Host "Already have archon data for $today — skipping scrape."
              "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
            }
          }
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Scrape archon.gg and regenerate WoWLogsStatsPrio.lua
        if: steps.freshness.outputs.skip != 'true'
        shell: pwsh
        run: .\scripts\Get-AllStats.ps1 -OutFile ".\WoWLogsStatsPrio.lua" -Threads 15

      - name: Bump version, commit, and push if data changed
        if: steps.freshness.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          Set-Location $env:GITHUB_WORKSPACE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git diff --quiet WoWLogsStatsPrio.lua
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Stat priority data is up to date, nothing to do."
            exit 0
          }

          $tocPath = Join-Path $env:GITHUB_WORKSPACE 'ZhuraStats.toc'
          $raw = Get-Content -LiteralPath $tocPath -Raw
          if ($raw -notmatch '(?m)^## Version:\s*(\d+)\.(\d+)\.(\d+)\s*$') {
            throw "Could not parse ## Version in ZhuraStats.toc"
          }

          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $patch = [int]$Matches[3] + 1
          $newVersion = "$major.$minor.$patch"

          $versionPattern = '(?m)^(## Version:\s*)\d+\.\d+\.\d+(\s*)$'
          $versionReplace = '${1}' + $newVersion + '${2}'
          $updated = $raw -replace $versionPattern, $versionReplace
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($tocPath, $updated, $utf8NoBom)

          $timestamp = Get-Date -Format "yyyyMMdd-HHmm"
          $branch = "chore/stat-prio-update-$timestamp"

          git add WoWLogsStatsPrio.lua ZhuraStats.toc
          $commitMsg = "chore: update stat priority data (archon.gg) -> v$newVersion"
          git commit -m $commitMsg
          git push origin HEAD:refs/heads/$branch

          gh pr create `
            --base master `
            --head $branch `
            --title "chore: update stat priority data (archon.gg) -> v$newVersion" `
            --body "Automated stat priority update from archon.gg. Auto-merged by workflow."

          gh pr merge --auto --squash `
            --subject "chore: update stat priority data (archon.gg) -> v$newVersion" `
            $branch

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: update
    if: failure()
    steps:
      - name: Telegram
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=❌ *zhura_stats* · Update Stat Priority failed
Run: ${URL}"
        env:
          BOT:  ${{ secrets.TG_BOT_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
          URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
