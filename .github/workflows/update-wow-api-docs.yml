# Nightly: refresh docs/wow-api/ from the Gethe/wow-ui-source mirror.
#
# IMPORTANT: this workflow MUST NOT modify ZhuraStats.toc. The version stays
# untouched, so the existing tag-release workflow finds the tag already present
# and stops without publishing — i.e. refreshing API docs never cuts a release.

name: Update WoW API Docs

on:
  schedule:
    - cron: "0 2 * * *"   # every night 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-wow-api-docs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out addon repo
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Clone wow-ui-source (live branch, shallow)
        run: |
          git clone --depth 1 --branch live \
            https://github.com/Gethe/wow-ui-source.git "$RUNNER_TEMP/wow-ui-source"

      - name: Regenerate docs/wow-api
        run: |
          python scripts/gen_api_index.py "$RUNNER_TEMP/wow-ui-source"

      - name: Commit, push, and auto-merge if docs changed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Guard: never touch the TOC here. If something did, abort so we can
          # never accidentally trigger a release from a docs refresh.
          if ! git diff --quiet -- ZhuraStats.toc; then
            echo "ZhuraStats.toc changed unexpectedly — aborting to avoid a release." >&2
            exit 1
          fi

          # Only the generated docs should ever change.
          if git diff --quiet -- docs/wow-api; then
            echo "API docs already up to date, nothing to do."
            exit 0
          fi

          build="$(sed -n 's/.*build \([0-9.]*\).*/\1/p' docs/wow-api/INDEX.md | head -n1)"
          timestamp="$(date -u +%Y%m%d-%H%M)"
          branch="chore/wow-api-docs-$timestamp"

          git add docs/wow-api
          git commit -m "chore: refresh WoW API docs (build $build)"
          git push origin "HEAD:refs/heads/$branch"

          gh pr create \
            --base master \
            --head "$branch" \
            --title "chore: refresh WoW API docs (build $build)" \
            --body "Automated WoW API doc refresh from Gethe/wow-ui-source (live). Does not touch ZhuraStats.toc, so no release is cut."

          gh pr merge --auto --squash \
            --subject "chore: refresh WoW API docs (build $build)" \
            "$branch"

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: update
    if: failure()
    steps:
      - name: Telegram
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_BOT_TOKEN }}
          format: html
          message: |
            ❌ <b>zhura_stats</b> · Update WoW API Docs failed
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
