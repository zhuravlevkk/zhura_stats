name: Temporary Valheim Steam build diagnostic
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Diagnose Steam dedicated build safely
        shell: bash
        run: |
          set -Eeuo pipefail
          docker stop valheim >/dev/null 2>&1 || true
          echo "container_running=$(docker inspect -f '{{.State.Running}}' valheim 2>/dev/null || echo absent)"
          manifest=$(docker run --rm --entrypoint /bin/bash ghcr.io/lloesche/valheim-server -lc 'find /opt/valheim -name appmanifest_896660.acf -type f -print -quit' 2>/dev/null || true)
          echo "fresh_image_bundled_manifest=${manifest:-none}"
          echo "safe_container_update_log_begin"
          docker logs valheim 2>&1 |
            grep -Eai 'steam|update|build|version|error|fail|supervisor|valheim-server' |
            grep -Evai 'pass(word)?|token|secret' |
            tail -n 160 || true
          echo "safe_container_update_log_end"
          docker run --rm --entrypoint /bin/bash ghcr.io/lloesche/valheim-server -lc '
            set -e
            steamcmd_path=$(command -v steamcmd || find / -name steamcmd.sh -type f -print -quit 2>/dev/null)
            echo "steamcmd_found=$([ -n "$steamcmd_path" ] && echo yes || echo no)"
            test -n "$steamcmd_path"
            "$steamcmd_path" +login anonymous +app_info_update 1 +app_info_print 896660 +quit 2>&1 |
              awk '"'"'
                /"branches"/ {branches=1}
                branches && /"public"/ {public=1}
                public && /"buildid"/ {
                  gsub(/"/,"")
                  gsub(/^[[:space:]]+|[[:space:]]+$/,"")
                  print "steam_public_" $0
                  exit
                }
              '"'"'
          '
          docker stop valheim >/dev/null 2>&1 || true
          echo "gameplay=stopped"
