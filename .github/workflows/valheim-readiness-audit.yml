name: Temporary Valheim 1.0 readiness audit

on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml

permissions:
  contents: read

jobs:
  upgrade-and-audit:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Upgrade Valheim safely and verify readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          COMPOSE=/opt/valheim/docker-compose.yml
          OLD_BUILD=21981590
          NEW_WORLD=ZhuraWorld_1_0
          ARCHIVE=/config/backups/ZhuraWorld-pre-1.0-20260908T103700Z.zip
          EXPECTED_SHA=c855e7dbd5bbb05269e2bf712af7ce85c180c43e852087d38c54d9b2640753c2
          HELPER=ghcr.io/lloesche/valheim-server
          BACKUP="${COMPOSE}.pre-1.0-20260909T$(date -u +%H%M%SZ).bak"
          changed=0

          rollback() {
            rc=$?
            trap - ERR
            echo "RESULT=FAILED"
            echo "failure_line=${BASH_LINENO[0]:-unknown}"
            if [ "$changed" -eq 1 ] && [ -f "$BACKUP" ]; then
              docker run --rm -v /opt/valheim:/host --entrypoint /bin/bash "$HELPER" -lc 'cp -f "/host/'"$(basename "$BACKUP")"'" /host/docker-compose.yml'
              echo "compose_rollback=restored"
            else
              echo "compose_rollback=not_needed"
            fi
            docker compose -f "$COMPOSE" stop >/dev/null 2>&1 || docker stop valheim >/dev/null 2>&1 || true
            echo "gameplay=stopped"
            exit "$rc"
          }
          trap rollback ERR

          docker image inspect "$HELPER" >/dev/null
          test -f "$COMPOSE"

          docker run --rm -v /opt/valheim/config:/config:ro --entrypoint /bin/bash "$HELPER" -lc '
            set -e
            test -s "'"$ARCHIVE"'"
            command -v unzip >/dev/null
            unzip -tqq "'"$ARCHIVE"'"
            actual=$(sha256sum "'"$ARCHIVE"'" | cut -d " " -f1)
            test "$actual" = "'"$EXPECTED_SHA"'"
          '
          echo "pre_1_0_archive=verified"

          docker run --rm -v /opt/valheim:/host --entrypoint /bin/bash "$HELPER" -lc '
            set -e
            f=/host/docker-compose.yml
            b=/host/'"$(basename "$BACKUP")"'
            total=$(grep -Ec "^[[:space:]-]*WORLD_NAME([:=])" "$f" || true)
            list=$(grep -Ec "^[[:space:]]*-[[:space:]]*WORLD_NAME=ZhuraWorld[[:space:]]*$" "$f" || true)
            map=$(grep -Ec "^[[:space:]]*WORLD_NAME:[[:space:]]*ZhuraWorld[[:space:]]*$" "$f" || true)
            test "$total" -eq 1
            test $((list + map)) -eq 1
            cp -p "$f" "$b"
            if [ "$list" -eq 1 ]; then
              sed -i -E "s/^([[:space:]]*-[[:space:]]*WORLD_NAME=)ZhuraWorld[[:space:]]*$/\\1ZhuraWorld_1_0/" "$f"
            else
              sed -i -E "s/^([[:space:]]*WORLD_NAME:[[:space:]]*)ZhuraWorld[[:space:]]*$/\\1ZhuraWorld_1_0/" "$f"
            fi
            test "$(grep -Ec "ZhuraWorld_1_0" "$f")" -eq 1
            test "$(grep -Ec "^[[:space:]]*-[[:space:]]*WORLD_NAME=ZhuraWorld[[:space:]]*$|^[[:space:]]*WORLD_NAME:[[:space:]]*ZhuraWorld[[:space:]]*$" "$f" || true)" -eq 0
          '
          changed=1
          echo "compose_backup=$(basename "$BACKUP")"
          echo "world_change=ZhuraWorld_to_ZhuraWorld_1_0"

          docker compose -f "$COMPOSE" pull
          docker compose -f "$COMPOSE" up -d --force-recreate

          ready=0
          for attempt in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Running}}' valheim 2>/dev/null || true)" = true ]; then
              build=$(docker exec valheim /bin/bash -lc '
                f=$(find /opt/valheim -name appmanifest_896660.acf -type f -print -quit 2>/dev/null)
                [ -n "$f" ] || exit 1
                awk -F\" "/\\"buildid\\"/ {print \\$4; exit}" "$f"
              ' 2>/dev/null || true)
              if [ -n "$build" ] && [ "$build" != "$OLD_BUILD" ] &&
                 docker exec valheim test -s "/config/worlds_local/${NEW_WORLD}.db" &&
                 docker exec valheim test -s "/config/worlds_local/${NEW_WORLD}.fwl" &&
                 docker exec valheim supervisorctl status valheim-server 2>/dev/null | grep -q RUNNING &&
                 docker exec valheim valheim-status >/dev/null 2>&1; then
                ready=1
                break
              fi
            fi
            sleep 15
          done
          test "$ready" -eq 1
          test "$build" != "$OLD_BUILD"

          for port in 2456 2457 2458; do
            docker port valheim "${port}/udp" | grep -q .
          done

          docker exec valheim /bin/bash -lc '
            test "${BEPINEX:-false}" != "true"
            test "${VALHEIM_PLUS:-false}" != "true"
            ! pgrep -af "BepInEx|ValheimPlus" >/dev/null
          '

          if docker logs --tail 800 valheim 2>&1 |
             grep -Eai "segmentation fault|fatal error|failed to start valheim|valheim-server[[:space:]]+FATAL" >/dev/null; then
            echo "fatal_log_check=failed"
            false
          fi

          db_size=$(docker exec valheim stat -c %s "/config/worlds_local/${NEW_WORLD}.db")
          fwl_size=$(docker exec valheim stat -c %s "/config/worlds_local/${NEW_WORLD}.fwl")
          supervisor=$(docker exec valheim supervisorctl status valheim-server | awk '{print $2}')
          status_ok=no
          docker exec valheim valheim-status >/dev/null 2>&1 && status_ok=yes

          echo "RESULT=SUCCESS"
          echo "world=$NEW_WORLD"
          echo "build_id=$build"
          echo "world_db_bytes=$db_size"
          echo "world_fwl_bytes=$fwl_size"
          echo "supervisor_valheim_server=$supervisor"
          echo "valheim_status=$status_ok"
          echo "udp_ports=2456,2457,2458"
          echo "mods=disabled"
          echo "fatal_errors=none"
          echo "pre_1_0_archive=preserved"
