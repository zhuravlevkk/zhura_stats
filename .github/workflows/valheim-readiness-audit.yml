name: Temporary Valheim correct-path Steam update
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Update the lloesche download directory
        shell: bash
        run: |
          set -Eeuo pipefail
          HELPER=ghcr.io/lloesche/valheim-server
          docker stop valheim >/dev/null 2>&1 || true
          docker run --rm --volumes-from valheim --entrypoint /bin/bash "$HELPER" -lc '
            set -Eeuo pipefail
            chown -R valheim:valheim /opt/valheim
            su valheim -s /bin/bash -c "HOME=/home/valheim /opt/steamcmd/steamcmd.sh +force_install_dir /opt/valheim/dl/server +login anonymous +app_update 896660 validate +quit"
            manifest=/opt/valheim/dl/server/steamapps/appmanifest_896660.acf
            test -s "$manifest"
            build=$(awk -F "\"" '"'"'/"buildid"/ {print $4; exit}'"'"' "$manifest")
            echo "download_build_id=$build"
            test "$build" = "25185644"
          '
          docker stop valheim >/dev/null 2>&1 || true
          echo "gameplay=stopped"
          echo "RESULT=DOWNLOAD_PATH_UPDATED"
