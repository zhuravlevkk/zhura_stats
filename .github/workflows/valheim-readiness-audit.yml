name: Valheim Readiness Audit

on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Deep audit Valheim readiness
        shell: bash
        run: |
          set -euo pipefail

          echo "=== HOST ==="
          date -u
          hostname
          uname -srmo
          uptime
          id
          df -h /
          free -h

          echo "=== CONTAINERS ==="
          docker version --format 'server={{.Server.Version}}'
          docker compose version
          docker ps --format 'name={{.Names}} | image={{.Image}} | status={{.Status}} | ports={{.Ports}}'

          container=valheim
          docker inspect "$container" >/dev/null

          echo "=== VALHEIM CONFIG (NO SECRETS) ==="
          docker inspect --format 'name={{.Name}} | image={{.Config.Image}} | state={{.State.Status}} | started={{.State.StartedAt}} | restart={{.HostConfig.RestartPolicy.Name}}' "$container"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container" |
            grep -E '^(WORLD_NAME|SERVER_NAME|TZ|BACKUPS|BACKUPS_CRON|BACKUPS_MAX_AGE|BACKUPS_MAX_COUNT|UPDATE_CRON|UPDATE_IF_IDLE|RESTART_CRON|RESTART_IF_IDLE|PUBLIC_TEST|BEPINEX|VALHEIM_PLUS|CROSSPLAY)=' || true
          docker inspect --format 'project={{index .Config.Labels "com.docker.compose.project"}} | working_dir={{index .Config.Labels "com.docker.compose.project.working_dir"}} | config={{index .Config.Labels "com.docker.compose.project.config_files"}}' "$container"

          echo "=== INTERNAL SERVICES ==="
          docker exec "$container" sh -lc 'supervisorctl status 2>&1 || true'
          docker exec "$container" sh -lc 'crontab -l 2>&1 || true'
          docker exec "$container" sh -lc 'valheim-status 2>&1 || true'

          echo "=== INSTALLED SERVER BUILD ==="
          docker exec "$container" sh -lc 'grep -E "\"(buildid|LastUpdated|StateFlags)\"" /opt/valheim/server/steamapps/appmanifest_896660.acf 2>/dev/null || find /opt/valheim -name appmanifest_896660.acf -exec grep -E "\"(buildid|LastUpdated|StateFlags)\"" {} \; 2>/dev/null'

          echo "=== WORLD ==="
          docker exec "$container" sh -lc 'find /config/worlds_local -maxdepth 1 -type f -name "ZhuraWorld*" -printf "%TY-%Tm-%TdT%TH:%TM:%TSZ | %s | %f\n" | sort'

          echo "=== BACKUPS ==="
          docker exec "$container" sh -lc '
            set -- /config/backups/*.zip
            if [ -e "$1" ]; then
              echo "count=$#"
              du -sh /config/backups
              echo "oldest=$(ls -1tr /config/backups/*.zip | head -n1)"
              echo "latest=$(ls -1t /config/backups/*.zip | head -n1)"
              unzip -t "$(ls -1t /config/backups/*.zip | head -n1)" | tail -n2
            else
              echo "count=0"
            fi
          '

          echo "=== RECENT ERRORS ==="
          docker logs --since 24h "$container" 2>&1 |
            grep -Ei 'error|exception|failed|crash|corrupt|disk full|out of memory' |
            tail -n 80 || true

          echo "=== PORTS ==="
          docker port "$container"
          ss -lun | grep -E ':(2456|2457|2458)\b'
