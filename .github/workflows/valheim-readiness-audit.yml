name: Temporary Valheim direct Steam update
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Update dedicated server without starting gameplay
        shell: bash
        run: |
          set -Eeuo pipefail
          HELPER=ghcr.io/lloesche/valheim-server
          ARCHIVE=/config/backups/ZhuraWorld-pre-1.0-20260908T103700Z.zip
          EXPECTED_SHA=c855e7dbd5bbb05269e2bf712af7ce85c180c43e852087d38c54d9b2640753c2
          docker stop valheim >/dev/null 2>&1 || true
          docker run --rm -i -e ARCHIVE="$ARCHIVE" -e EXPECTED_SHA="$EXPECTED_SHA" \
            -v /opt/valheim/config:/config:ro --entrypoint /bin/bash "$HELPER" -s <<'VERIFY'
          set -e
          test -s "$ARCHIVE"
          unzip -tqq "$ARCHIVE"
          test "$(sha256sum "$ARCHIVE" | cut -d " " -f1)" = "$EXPECTED_SHA"
          VERIFY
          echo "pre_1_0_archive=verified"

          docker run --rm --volumes-from valheim --entrypoint /bin/bash "$HELPER" -lc '
            set -Eeuo pipefail
            chown -R valheim:valheim /opt/valheim
            su valheim -s /bin/bash -c "HOME=/home/valheim /opt/steamcmd/steamcmd.sh +force_install_dir /opt/valheim +login anonymous +app_update 896660 validate +quit"
            manifest=$(find /opt/valheim -name appmanifest_896660.acf -type f -print -quit)
            test -n "$manifest"
            build=$(awk -F "\"" '"'"'/"buildid"/ {print $4; exit}'"'"' "$manifest")
            echo "installed_build_id=$build"
            test "$build" = "25185644"
          '
          docker stop valheim >/dev/null 2>&1 || true
          echo "gameplay=stopped"
          echo "RESULT=STEAM_UPDATE_SUCCESS"
