name: Temporary Valheim safe config preflight
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Print non-secret world configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          COMPOSE=/opt/valheim/docker-compose.yml
          test -s "$COMPOSE"
          echo "container_running=$(docker inspect -f '{{.State.Running}}' valheim 2>/dev/null || echo absent)"
          echo "world_config_begin"
          grep -E 'WORLD_NAME|SERVER_ARGS|^[[:space:]]*-modifier ' "$COMPOSE" || true
          echo "world_config_end"
