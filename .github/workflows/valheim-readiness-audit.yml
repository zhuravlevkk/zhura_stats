name: Temporary Valheim safe mod diagnostic
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect non-secret mod and world state
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "container_running=$(docker inspect -f '{{.State.Running}}' valheim 2>/dev/null || echo absent)"
          echo "mod_environment_begin"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' valheim |
            grep -Ei '^(BEPINEX|VALHEIM_PLUS|VALHEIMPLUS|MODS?|MOD_)' || true
          echo "mod_environment_end"
          docker run --rm --volumes-from valheim --entrypoint /bin/bash ghcr.io/lloesche/valheim-server -lc '
            for p in /config/bepinex /config/BepInEx /config/valheimplus /config/ValheimPlus /opt/valheim/dl/server/BepInEx; do
              if [ -e "$p" ]; then
                files=$(find "$p" -type f 2>/dev/null | wc -l)
                echo "mod_path=$p files=$files"
              fi
            done
            files=$(find /config/worlds_local/ZhuraWorld_1_0 -type f -size +0c 2>/dev/null | wc -l)
            bytes=$(find /config/worlds_local/ZhuraWorld_1_0 -type f -printf "%s\n" 2>/dev/null | awk "{s+=\$1} END {print s+0}")
            echo "world_files=$files world_bytes=$bytes"
          '
          echo "safe_mod_log_begin"
          docker logs valheim 2>&1 |
            grep -Ei 'Valheim version|isModded|BepInEx|ValheimPlus|modded|Opened Steam server|Loading: Done|Could not parse|fatal' |
            grep -Evai 'pass(word)?|token|secret' || true
          echo "safe_mod_log_end"
