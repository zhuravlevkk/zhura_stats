name: Temporary Valheim safe args probe
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect sanitized SERVER_ARGS block
        shell: bash
        run: |
          set -Eeuo pipefail
          docker stop valheim >/dev/null 2>&1 || true
          docker run --rm -i -v /opt/valheim:/host --entrypoint /bin/bash ghcr.io/lloesche/valheim-server -s <<'PROBE'
          set -e
          awk '
            /^[[:space:]]*(-[[:space:]]*)?SERVER_ARGS[=:]/ {show=8}
            show>0 {
              line=$0
              gsub(/(PASS|PASSWORD|TOKEN|SECRET)[^ ]*/, "[REDACTED]", line)
              print line
              show--
            }
          ' /host/docker-compose.yml.bak
          PROBE
          echo "gameplay=stopped"
