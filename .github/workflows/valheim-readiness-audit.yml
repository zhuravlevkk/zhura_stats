name: Temporary Valheim post-launch diagnostic
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect launch predicates safely
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "container_running=$(docker inspect -f '{{.State.Running}}' valheim 2>/dev/null || echo absent)"
          docker run --rm --volumes-from valheim --entrypoint /bin/bash ghcr.io/lloesche/valheim-server -lc '
            set -e
            for f in /opt/valheim/dl/server/steamapps/appmanifest_896660.acf /opt/valheim/steamapps/appmanifest_896660.acf; do
              if [ -s "$f" ]; then
                build=$(awk -F "\"" '"'"'/"buildid"/ {print $4; exit}'"'"' "$f")
                echo "manifest=$f build_id=$build"
              fi
            done
            find /config/worlds_local -maxdepth 1 -name "ZhuraWorld_1_0*" -printf "world_path=%p type=%y bytes=%s modified=%TY-%Tm-%TdT%TH:%TM:%TS\n" | sort
          '
          echo "safe_log_tail_begin"
          docker logs --tail 220 valheim 2>&1 |
            grep -Evai 'pass(word)?|token|secret' || true
          echo "safe_log_tail_end"
