name: Temporary Valheim safe compose probe
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect safe compose structure
        shell: bash
        run: |
          set -Eeuo pipefail
          HELPER=ghcr.io/lloesche/valheim-server
          docker stop valheim >/dev/null 2>&1 || true
          docker image inspect "$HELPER" >/dev/null
          docker run --rm -i -v /opt/valheim:/host --entrypoint /bin/bash "$HELPER" -s <<'PROBE'
          set -e
          for f in /host/docker-compose.yml.bak /host/docker-compose.yml; do
            test -s "$f"
            echo "file=$(basename "$f")"
            grep -E '^[[:space:]]*WORLD_NAME[=:]' "$f" | sed -E 's/[[:space:]]+/ /g'
            awk '
              /^[[:space:]]*(-[[:space:]]*)?SERVER_ARGS[=:]/ {
                print "server_args_lines=1"
                print "server_args_mapping=" ($0 ~ /SERVER_ARGS:/ ? "yes" : "no")
                print "server_args_list=" ($0 ~ /-[[:space:]]*SERVER_ARGS=/ ? "yes" : "no")
                print "server_args_ends_double_quote=" ($0 ~ /"[[:space:]]*$/ ? "yes" : "no")
                print "resources_modifier_count=" gsub(/-modifier resources muchmore/, "")
                print "combat_modifier_count=" gsub(/-modifier combat [^ ]+/, "")
                print "death_modifier_count=" gsub(/-modifier deathpenalty [^ ]+/, "")
              }
            ' "$f"
          done
          PROBE
          echo "gameplay=stopped"
