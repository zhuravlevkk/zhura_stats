name: Temporary Valheim compose backup probe
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: List sanitized Valheim compose backups
        shell: bash
        run: |
          set -euo pipefail
          HELPER=ghcr.io/lloesche/valheim-server
          docker stop valheim >/dev/null 2>&1 || true
          docker run --rm -i -v /opt/valheim:/host --entrypoint /bin/bash "$HELPER" -s <<'PROBE'
          set -e
          for b in /host/docker-compose.yml*.bak; do
            [ -f "$b" ] || continue
            world=$(grep -E '^[[:space:]]*(-[[:space:]]*)?WORLD_NAME[=:]' "$b" | tr -d '[:space:]' || true)
            combat=$(grep -Fc -- '-modifier combat veryhard' "$b" || true)
            resources=$(grep -Fc -- '-modifier resources muchmore' "$b" || true)
            death=$(grep -Fc -- '-modifier deathpenalty casual' "$b" || true)
            echo "backup=$(basename "$b") world=$world combat=$combat resources=$resources death=$death"
          done
          PROBE
