name: Temporary Valheim 1.0 final launch
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
concurrency:
  group: valheim-1-0-final-launch
  cancel-in-progress: false
jobs:
  launch:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Verify backup, configure, launch, and audit
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE=ghcr.io/lloesche/valheim-server
          COMPOSE=/opt/valheim/docker-compose.yml
          ARCHIVE=/config/backups/ZhuraWorld-pre-1.0-20260908T103700Z.zip
          ARCHIVE_SHA=c855e7dbd5bbb05269e2bf712af7ce85c180c43e852087d38c54d9b2640753c2
          OLD_BUILD=21981590
          NEW_WORLD=ZhuraWorld_1_0
          ROLLBACK="${COMPOSE}.pre-final-$(date -u +%Y%m%dT%H%M%SZ)"

          fail() { echo "CHECK_FAILED=$1" >&2; return 1; }
          rollback() {
            rc=$?
            trap - ERR
            echo "FINAL_RESULT=FAILED rc=$rc; restoring compose and stopping game"
            if [ -s "$ROLLBACK" ]; then
              docker run --rm -v /opt/valheim:/host --entrypoint cp "$IMAGE" -a "/host/${ROLLBACK##*/}" /host/docker-compose.yml || true
            fi
            docker stop valheim >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap rollback ERR

          test -s "$COMPOSE" || fail compose_missing
          docker inspect valheim >/dev/null || fail container_missing
          docker run --rm -v /opt/valheim:/host --entrypoint cp "$IMAGE" -a /host/docker-compose.yml "/host/${ROLLBACK##*/}"
          echo "compose_backup=$ROLLBACK"

          docker run --rm --volumes-from valheim --entrypoint /bin/bash "$IMAGE" -lc "
            set -Eeuo pipefail
            test -s '$ARCHIVE'
            actual=\$(sha256sum '$ARCHIVE' | awk '{print \$1}')
            test \"\$actual\" = '$ARCHIVE_SHA'
            unzip -tqq '$ARCHIVE'
          " || fail archive_integrity
          echo "pre_1_0_archive=verified"

          test "$(grep -Ec 'WORLD_NAME=ZhuraWorld[[:space:]]*$|WORLD_NAME:[[:space:]]*"?ZhuraWorld"?[[:space:]]*$' "$COMPOSE" || true)" -eq 1 || fail unexpected_world_name
          test "$(grep -Ec -- '-modifier combat normal([[:space:]]|$)' "$COMPOSE" || true)" -eq 1 || fail unexpected_combat
          test "$(grep -Ec -- '-modifier deathpenalty veryeasy([[:space:]]|$)' "$COMPOSE" || true)" -eq 1 || fail unexpected_deathpenalty
          test "$(grep -Ec -- '-modifier resources muchmore([[:space:]]|$)' "$COMPOSE" || true)" -eq 1 || fail unexpected_resources
          test "$(grep -Ec -- '-modifier raids normal([[:space:]]|$)' "$COMPOSE" || true)" -eq 1 || fail unexpected_raids
          test "$(grep -Ec -- '-modifier portals normal([[:space:]]|$)' "$COMPOSE" || true)" -eq 1 || fail unexpected_portals

          docker run --rm -v /opt/valheim:/host --entrypoint sed "$IMAGE" -i -E 's/(WORLD_NAME=)ZhuraWorld([[:space:]]*)$/\1ZhuraWorld_1_0\2/' /host/docker-compose.yml
          docker run --rm -v /opt/valheim:/host --entrypoint sed "$IMAGE" -i -E 's/(WORLD_NAME:[[:space:]]*)"?ZhuraWorld"?([[:space:]]*)$/\1"ZhuraWorld_1_0"\2/' /host/docker-compose.yml
          docker run --rm -v /opt/valheim:/host --entrypoint sed "$IMAGE" -i -E 's/-modifier combat normal([[:space:]]*)$/-modifier combat veryhard\1/' /host/docker-compose.yml
          docker run --rm -v /opt/valheim:/host --entrypoint sed "$IMAGE" -i -E 's/-modifier deathpenalty veryeasy([[:space:]]*)$/-modifier deathpenalty casual\1/' /host/docker-compose.yml
          docker run --rm -v /opt/valheim:/host --entrypoint sed "$IMAGE" -i -E '/-modifier portals normal([[:space:]]*)$/d' /host/docker-compose.yml

          test "$(grep -Ec 'WORLD_NAME=ZhuraWorld_1_0[[:space:]]*$|WORLD_NAME:[[:space:]]*"?ZhuraWorld_1_0"?[[:space:]]*$' "$COMPOSE" || true)" -eq 1 || fail world_edit
          test "$(grep -Ec -- '-modifier combat veryhard([[:space:]]|$)' "$COMPOSE" || true)" -eq 1 || fail combat_edit
          test "$(grep -Ec -- '-modifier deathpenalty casual([[:space:]]|$)' "$COMPOSE" || true)" -eq 1 || fail deathpenalty_edit
          ! grep -Eq -- '-modifier portals([[:space:]]|$)' "$COMPOSE" || fail portals_remove
          docker compose -f "$COMPOSE" config -q || fail compose_validation
          echo "compose_configuration=validated"

          docker run --rm --volumes-from valheim --entrypoint /bin/bash "$IMAGE" -lc "
            set -Eeuo pipefail
            rm -rf '/config/worlds_local/$NEW_WORLD'
            rm -f '/config/worlds_local/$NEW_WORLD.db' '/config/worlds_local/$NEW_WORLD.fwl'
          "
          echo "new_world_previous_attempt=cleared"

          docker compose -f "$COMPOSE" pull
          docker compose -f "$COMPOSE" up -d --force-recreate

          ready=0
          for i in $(seq 1 120); do
            running=$(docker inspect -f '{{.State.Running}}' valheim 2>/dev/null || true)
            build=$(docker exec valheim bash -lc "awk -F '\"' '/\"buildid\"/ {print \$4; exit}' /opt/valheim/dl/server/steamapps/appmanifest_896660.acf" 2>/dev/null || true)
            files=$(docker exec valheim bash -lc "find '/config/worlds_local/$NEW_WORLD' -type f -size +0c 2>/dev/null | wc -l" 2>/dev/null || echo 0)
            if [ "$running" = true ] && [ -n "$build" ] && [ "$build" != "$OLD_BUILD" ] &&
               docker logs valheim 2>&1 | grep -q 'Valheim version' &&
               docker logs valheim 2>&1 | grep -q 'Opened Steam server' &&
               docker logs valheim 2>&1 | grep -q 'Loading: Done' &&
               [ "${files:-0}" -gt 0 ]; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1 || fail readiness_timeout

          build=$(docker exec valheim bash -lc "awk -F '\"' '/\"buildid\"/ {print \$4; exit}' /opt/valheim/dl/server/steamapps/appmanifest_896660.acf")
          test -n "$build" && test "$build" != "$OLD_BUILD" || fail build_id

          supervisor=$(docker exec valheim supervisorctl status valheim-server)
          printf '%s\n' "$supervisor" | grep -q RUNNING || fail supervisor
          docker exec valheim valheim-status >/dev/null || fail valheim_status
          for port in 2456 2457 2458; do
            docker port valheim "${port}/udp" | grep -q . || fail "udp_port_$port"
          done

          docker logs valheim 2>&1 | grep -q 'isModded False' || fail mods
          ! docker logs valheim 2>&1 | grep -Eqi 'Could not parse|(^|[^a-z])(FATAL|Segmentation fault|Out of memory|Failed to initialize|failed to load world)([^a-z]|$)' || fail fatal_log

          world_files=$(docker exec valheim bash -lc "find '/config/worlds_local/$NEW_WORLD' -type f -size +0c | wc -l")
          world_bytes=$(docker exec valheim bash -lc "find '/config/worlds_local/$NEW_WORLD' -type f -printf '%s\n' | awk '{s+=\$1} END {print s+0}'")
          test "$world_files" -gt 0 && test "$world_bytes" -gt 0 || fail world_save

          docker run --rm --volumes-from valheim --entrypoint /bin/bash "$IMAGE" -lc "
            test -s '$ARCHIVE' &&
            test \"\$(sha256sum '$ARCHIVE' | awk '{print \$1}')\" = '$ARCHIVE_SHA'
          " || fail archive_postcheck

          version=$(docker logs valheim 2>&1 | sed -n 's/.*Valheim version: //p' | tail -1)
          printf 'FINAL_RESULT=SUCCESS\n'
          printf 'world=%s\n' "$NEW_WORLD"
          printf 'build_id=%s\n' "$build"
          printf 'version=%s\n' "$version"
          printf 'world_files=%s\n' "$world_files"
          printf 'world_bytes=%s\n' "$world_bytes"
          printf 'supervisor=%s\n' "$supervisor"
          printf 'ports=2456-2458/udp published\n'
          printf 'mods=isModded False\n'
          printf 'settings=combat:veryhard resources:muchmore deathpenalty:casual raids:normal portals:default\n'
          printf 'archive=verified-preserved\n'
          trap - ERR
