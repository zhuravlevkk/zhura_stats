name: Temporary Valheim manifest diagnostic
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect all dedicated manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          docker stop valheim >/dev/null 2>&1 || true
          docker run --rm --volumes-from valheim --entrypoint /bin/bash ghcr.io/lloesche/valheim-server -lc '
            set -e
            count=0
            while IFS= read -r f; do
              count=$((count+1))
              build=$(awk -F "\"" '"'"'/"buildid"/ {print $4; exit}'"'"' "$f")
              bytes=$(stat -c %s "$f")
              modified=$(stat -c %y "$f" | cut -d. -f1)
              echo "manifest_path=$f build_id=$build bytes=$bytes modified=$modified"
            done < <(find /opt/valheim -name appmanifest_896660.acf -type f -print | sort)
            echo "manifest_count=$count"
            find /opt/valheim -maxdepth 3 -type f \( -name valheim_server.x86_64 -o -name valheim_server.x86 \) -printf "server_binary=%p bytes=%s modified=%TY-%Tm-%TdT%TH:%TM:%TS\n" | sort
          '
          docker stop valheim >/dev/null 2>&1 || true
          echo "gameplay=stopped"
