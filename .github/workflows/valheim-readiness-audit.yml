name: Temporary Valheim durable save and restart audit
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Persist new world, restart, and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          WORLD=ZhuraWorld_1_0
          ARCHIVE=/config/backups/ZhuraWorld-pre-1.0-20260908T103700Z.zip
          ARCHIVE_SHA=c855e7dbd5bbb05269e2bf712af7ce85c180c43e852087d38c54d9b2640753c2
          stopped=0
          fail() { echo "CHECK_FAILED=$1" >&2; return 1; }
          safe_stop() {
            rc=$?
            trap - ERR
            docker exec valheim supervisorctl stop valheim-server >/dev/null 2>&1 || true
            echo "FINAL_RESULT=FAILED rc=$rc; game process left stopped"
            exit "$rc"
          }
          trap safe_stop ERR

          test "$(docker inspect -f '{{.State.Running}}' valheim)" = true || fail container
          docker exec valheim supervisorctl status valheim-server | grep -q RUNNING || fail supervisor_initial
          opened_before=$(docker logs valheim 2>&1 | grep -c 'Opened Steam server' || true)

          docker exec valheim supervisorctl stop valheim-server
          stopped=1
          docker exec valheim supervisorctl status valheim-server | grep -q STOPPED || fail graceful_stop
          docker logs valheim 2>&1 | grep -q 'DB2 writing done' || fail db2_write
          docker logs valheim 2>&1 | grep -q 'FWL writing done' || fail fwl_write

          files=$(docker exec valheim bash -lc "find '/config/worlds_local/$WORLD' -type f -size +0c | wc -l")
          bytes=$(docker exec valheim bash -lc "find '/config/worlds_local/$WORLD' -type f -printf '%s\n' | awk '{s+=\$1} END {print s+0}'")
          test "$files" -ge 4 || fail world_file_count
          test "$bytes" -gt 1000 || fail world_size
          echo "durable_world_save=verified files=$files bytes=$bytes"

          docker exec valheim supervisorctl start valheim-server
          ready=0
          for i in $(seq 1 90); do
            status=$(docker exec valheim supervisorctl status valheim-server 2>/dev/null || true)
            opened_now=$(docker logs valheim 2>&1 | grep -c 'Opened Steam server' || true)
            if printf '%s\n' "$status" | grep -q RUNNING &&
               [ "$opened_now" -gt "$opened_before" ] &&
               docker logs valheim 2>&1 | tail -250 | grep -q 'Loading: Done'; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1 || fail restart_readiness

          build=$(docker exec valheim bash -lc "awk -F '\"' '/\"buildid\"/ {print \$4; exit}' /opt/valheim/dl/server/steamapps/appmanifest_896660.acf")
          test "$build" = 25185644 || fail build
          supervisor=$(docker exec valheim supervisorctl status valheim-server)
          printf '%s\n' "$supervisor" | grep -q RUNNING || fail supervisor_final
          docker exec valheim valheim-status >/dev/null || fail valheim_status
          for port in 2456 2457 2458; do
            docker port valheim "${port}/udp" | grep -q . || fail "udp_port_$port"
          done
          docker logs valheim 2>&1 | tail -300 | grep -q 'isModded: False' || fail mods
          ! docker logs valheim 2>&1 | tail -300 | grep -Eqi 'Could not parse|(^|[^a-z])(FATAL|Segmentation fault|Out of memory|Failed to initialize|failed to load world)([^a-z]|$)' || fail fatal_log

          docker run --rm --volumes-from valheim --entrypoint /bin/bash ghcr.io/lloesche/valheim-server -lc "
            test -s '$ARCHIVE' &&
            test \"\$(sha256sum '$ARCHIVE' | awk '{print \$1}')\" = '$ARCHIVE_SHA' &&
            unzip -tqq '$ARCHIVE'
          " || fail archive

          version=$(docker logs valheim 2>&1 | sed -n 's/.*Valheim version: //p' | tail -1)
          printf 'FINAL_RESULT=SUCCESS\n'
          printf 'world=%s\n' "$WORLD"
          printf 'build_id=%s\n' "$build"
          printf 'version=%s\n' "$version"
          printf 'world_files=%s\n' "$files"
          printf 'world_bytes=%s\n' "$bytes"
          printf 'supervisor=%s\n' "$supervisor"
          printf 'ports=2456-2458/udp published\n'
          printf 'mods=isModded: False\n'
          printf 'settings=combat:veryhard resources:muchmore deathpenalty:casual raids:default portals:default\n'
          printf 'archive=verified-preserved\n'
          trap - ERR
