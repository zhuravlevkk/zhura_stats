name: Temporary Valheim 1.0 configured launch

on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml

permissions:
  contents: read

jobs:
  configured-launch:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Configure, launch, and audit Valheim 1.0
        shell: bash
        run: |
          set -Eeuo pipefail
          COMPOSE=/opt/valheim/docker-compose.yml
          OLD_BUILD=21981590
          NEW_WORLD=ZhuraWorld_1_0
          ARCHIVE=/config/backups/ZhuraWorld-pre-1.0-20260908T103700Z.zip
          EXPECTED_SHA=c855e7dbd5bbb05269e2bf712af7ce85c180c43e852087d38c54d9b2640753c2
          HELPER=ghcr.io/lloesche/valheim-server
          BACKUP=
          changed=0

          rollback() {
            rc=$?
            trap - ERR
            echo "RESULT=FAILED"
            echo "failure_line=${BASH_LINENO[0]:-unknown}"
            if [ "$changed" -eq 1 ] && [ -n "$BACKUP" ] && [ -f "$BACKUP" ]; then
              backup_name=$(basename "$BACKUP")
              docker run --rm -e BACKUP_NAME="$backup_name" -v /opt/valheim:/host --entrypoint /bin/bash "$HELPER" -s <<'RESTORE'
          set -e
          cp -f "/host/$BACKUP_NAME" /host/docker-compose.yml
          RESTORE
              echo "compose_rollback=restored"
            else
              echo "compose_rollback=not_needed"
            fi
            docker compose -f "$COMPOSE" stop >/dev/null 2>&1 || docker stop valheim >/dev/null 2>&1 || true
            echo "gameplay=stopped"
            exit "$rc"
          }
          trap rollback ERR

          docker image inspect "$HELPER" >/dev/null
          test -f "$COMPOSE"

          docker run --rm -e ARCHIVE="$ARCHIVE" -e EXPECTED_SHA="$EXPECTED_SHA"             -v /opt/valheim/config:/config:ro --entrypoint /bin/bash "$HELPER" -s <<'ARCHIVE_CHECK'
          set -e
          test -s "$ARCHIVE"
          unzip -tqq "$ARCHIVE"
          actual=$(sha256sum "$ARCHIVE" | cut -d " " -f1)
          test "$actual" = "$EXPECTED_SHA"
          ARCHIVE_CHECK
          echo "pre_1_0_archive=verified"

          state=$(docker run --rm -v /opt/valheim:/host --entrypoint /bin/bash "$HELPER" -s <<'STATE_CHECK'
          set -e
          f=/host/docker-compose.yml
          test "$(grep -Ec '^[[:space:]]*(-[[:space:]]*)?WORLD_NAME[=:]' "$f" || true)" -eq 1
          test "$(grep -Ec '^[[:space:]]*(-[[:space:]]*)?SERVER_ARGS[=:]' "$f" || true)" -eq 1
          world_line=$(grep -E '^[[:space:]]*(-[[:space:]]*)?WORLD_NAME[=:]' "$f" | tr -d '[:space:]')
          case "$world_line" in
            '-WORLD_NAME=ZhuraWorld'|'WORLD_NAME:ZhuraWorld'|'WORLD_NAME:"ZhuraWorld"')
              echo old
              ;;
            '-WORLD_NAME=ZhuraWorld_1_0'|'WORLD_NAME:ZhuraWorld_1_0'|'WORLD_NAME:"ZhuraWorld_1_0"')
              test "$(grep -Fc -- '-modifier combat veryhard' "$f")" -eq 1
              test "$(grep -Fc -- '-modifier resources muchmore' "$f")" -eq 1
              test "$(grep -Fc -- '-modifier deathpenalty casual' "$f")" -eq 1
              echo configured
              ;;
            *)
              exit 44
              ;;
          esac
          STATE_CHECK
          )

          if [ "$state" = old ]; then
            BACKUP="${COMPOSE}.pre-1.0-configured-20260909T$(date -u +%H%M%SZ).bak"
            backup_name=$(basename "$BACKUP")
            docker run --rm -e BACKUP_NAME="$backup_name" -v /opt/valheim:/host               --entrypoint /bin/bash "$HELPER" -s <<'CONFIGURE'
          set -e
          f=/host/docker-compose.yml
          b="/host/$BACKUP_NAME"
          cp -p "$f" "$b"
          awk '
            /^[[:space:]]*(-[[:space:]]*)?SERVER_ARGS[=:]/ {
              if ($0 ~ /-modifier[[:space:]]+(combat|resources|deathpenalty)/) exit 45
              if ($0 ~ /"[[:space:]]*$/) {
                sub(/"[[:space:]]*$/, " -modifier combat veryhard -modifier resources muchmore -modifier deathpenalty casual\"")
              } else {
                $0 = $0 " -modifier combat veryhard -modifier resources muchmore -modifier deathpenalty casual"
              }
            }
            { print }
          ' "$f" > "$f.tmp"
          cat "$f.tmp" > "$f"
          rm -f "$f.tmp"
          sed -i -E '/WORLD_NAME/ s/ZhuraWorld/ZhuraWorld_1_0/' "$f"
          test "$(grep -Fc -- 'ZhuraWorld_1_0' "$f")" -eq 1
          test "$(grep -Fc -- '-modifier combat veryhard' "$f")" -eq 1
          test "$(grep -Fc -- '-modifier resources muchmore' "$f")" -eq 1
          test "$(grep -Fc -- '-modifier deathpenalty casual' "$f")" -eq 1
          CONFIGURE
            changed=1
          elif [ "$state" = configured ]; then
            original_name=$(docker run --rm -v /opt/valheim:/host --entrypoint /bin/bash "$HELPER" -s <<'FIND_BACKUP'
          set -e
          for b in $(ls -1t /host/docker-compose.yml.pre-1.0-configured-*.bak 2>/dev/null); do
            line=$(grep -E '^[[:space:]]*(-[[:space:]]*)?WORLD_NAME[=:]' "$b" | tr -d '[:space:]')
            case "$line" in
              '-WORLD_NAME=ZhuraWorld'|'WORLD_NAME:ZhuraWorld'|'WORLD_NAME:"ZhuraWorld"')
                basename "$b"
                exit 0
                ;;
            esac
          done
          exit 1
          FIND_BACKUP
            )
            BACKUP="/opt/valheim/$original_name"
            changed=1
          else
            false
          fi

          echo "compose_backup=$(basename "$BACKUP")"
          echo "world=$NEW_WORLD"
          echo "combat=veryhard"
          echo "resources=2x"
          echo "death_penalty=casual"

          docker compose -f "$COMPOSE" pull
          docker compose -f "$COMPOSE" up -d --force-recreate

          ready=0
          build=
          for attempt in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Running}}' valheim 2>/dev/null || true)" = true ]; then
              manifest=$(docker exec valheim find /opt/valheim -name appmanifest_896660.acf -type f -print -quit 2>/dev/null || true)
              if [ -n "$manifest" ]; then
                build=$(docker exec valheim grep buildid "$manifest" 2>/dev/null | head -1 | tr -d '"[:space:]' | cut -d: -f2 || true)
              fi
              if [ -n "$build" ] && [ "$build" != "$OLD_BUILD" ] &&
                 docker exec valheim test -s "/config/worlds_local/${NEW_WORLD}.db" &&
                 docker exec valheim test -s "/config/worlds_local/${NEW_WORLD}.fwl" &&
                 docker exec valheim supervisorctl status valheim-server 2>/dev/null | grep -q RUNNING &&
                 docker exec valheim valheim-status >/dev/null 2>&1; then
                ready=1
                break
              fi
            fi
            sleep 15
          done
          test "$ready" -eq 1

          for port in 2456 2457 2458; do
            docker port valheim "${port}/udp" | grep -q .
          done

          docker exec valheim /bin/bash -lc '
            test "${BEPINEX:-false}" != "true"
            test "${VALHEIM_PLUS:-false}" != "true"
            ! pgrep -af "Bep[I]nEx|Valheim[P]lus" >/dev/null
          '

          if docker logs --tail 800 valheim 2>&1 |
             grep -Eai 'segmentation fault|fatal error|failed to start valheim|valheim-server[[:space:]]+FATAL' >/dev/null; then
            echo "fatal_log_check=failed"
            false
          fi

          db_size=$(docker exec valheim stat -c %s "/config/worlds_local/${NEW_WORLD}.db")
          fwl_size=$(docker exec valheim stat -c %s "/config/worlds_local/${NEW_WORLD}.fwl")
          supervisor=$(docker exec valheim supervisorctl status valheim-server | awk '{print $2}')
          echo "RESULT=SUCCESS"
          echo "build_id=$build"
          echo "world_db_bytes=$db_size"
          echo "world_fwl_bytes=$fwl_size"
          echo "supervisor_valheim_server=$supervisor"
          echo "valheim_status=ok"
          echo "udp_ports=2456,2457,2458"
          echo "mods=disabled"
          echo "fatal_errors=none"
          echo "pre_1_0_archive=preserved"
