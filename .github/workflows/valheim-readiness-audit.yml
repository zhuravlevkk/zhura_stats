name: Temporary Valheim clean dedicated install
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  install:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Install public dedicated build into clean directory
        shell: bash
        run: |
          set -Eeuo pipefail
          HELPER=ghcr.io/lloesche/valheim-server
          docker stop valheim >/dev/null 2>&1 || true
          docker run --rm --volumes-from valheim --entrypoint /bin/bash "$HELPER" -lc '
            set -Eeuo pipefail
            base=/opt/valheim/dl
            fresh=$base/server-new-25185644
            old=$base/server-pre-1.0-21981590
            test ! -e "$old"
            rm -rf "$fresh"
            mkdir -p "$fresh"
            chown -R valheim:valheim "$fresh"
            su valheim -s /bin/bash -c "HOME=/home/valheim /opt/steamcmd/steamcmd.sh +force_install_dir $fresh +login anonymous +app_update 896660 validate +quit"
            manifest=$fresh/steamapps/appmanifest_896660.acf
            test -s "$manifest"
            build=$(awk -F "\"" '"'"'/"buildid"/ {print $4; exit}'"'"' "$manifest")
            echo "fresh_build_id=$build"
            test "$build" = "25185644"
            test -x "$fresh/valheim_server.x86_64"
            mv "$base/server" "$old"
            mv "$fresh" "$base/server"
            echo "old_server_build_preserved=$old"
          '
          docker stop valheim >/dev/null 2>&1 || true
          echo "gameplay=stopped"
          echo "RESULT=CLEAN_INSTALL_SUCCESS"
