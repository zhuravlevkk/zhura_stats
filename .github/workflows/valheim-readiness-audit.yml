name: Temporary Valheim save capability diagnostic
on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect save capability without changing server
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "container_running=$(docker inspect -f '{{.State.Running}}' valheim)"
          docker exec valheim supervisorctl status valheim-server
          echo "commands_begin"
          docker exec valheim bash -lc 'compgen -c | grep -E "^valheim-" | sort -u' || true
          echo "commands_end"
          echo "world_files_begin"
          docker exec valheim bash -lc 'find /config/worlds_local/ZhuraWorld_1_0 -type f -printf "%P bytes=%s\n" 2>/dev/null | sort'
          echo "world_files_end"
