name: Keep Valheim Offline Until 1.0

on:
  push:
    branches:
      - codex/valheim-readiness-20260908
    paths:
      - .github/workflows/valheim-readiness-audit.yml

permissions:
  contents: read

jobs:
  stop:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Stop Valheim container
        shell: bash
        run: |
          set -euo pipefail
          docker stop --time 120 valheim
          state=$(docker inspect --format '{{.State.Status}}' valheim)
          echo "valheim_container_state=$state"
          test "$state" = "exited"
